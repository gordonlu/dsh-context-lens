<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>anomaly</title>
<style>
  /* 异常场景特写 1:1 · 1080×1080 · 色值从真实产品 UI 抽取 */
  :root {
    --bg: #0f1420;
    --panel: #171d2b;
    --panel-line: rgba(255,255,255,0.08);
    --ink: #eef2f8;
    --ink-2: #9aa4b8;
    --ok: #3ddc84;
    --bad: #ff6b6b;
    --accent: #7aa2ff;
    --mono: ui-monospace, 'SF Mono', Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    padding: 80px 76px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .kicker { font-size: 26px; color: var(--ink-2); letter-spacing: 0.08em; }
  .title { margin-top: 24px; font-size: 62px; line-height: 1.3; font-weight: 900; }
  .title em { font-style: normal; color: var(--bad); }
  .banner {
    margin-top: 44px;
    border: 1px solid rgba(255,107,107,0.4);
    background: rgba(255,107,107,0.08);
    border-radius: 14px;
    padding: 22px 26px;
    font-size: 28px; color: var(--bad); font-weight: 600;
  }
  .card {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 20px;
    padding: 34px 36px;
  }
  .head { display: flex; align-items: baseline; gap: 18px; }
  .head .n { font-family: var(--mono); font-size: 40px; font-weight: 700; }
  .head .pill { font-size: 22px; font-weight: 700; padding: 6px 16px; border-radius: 999px; background: rgba(255,107,107,0.14); color: var(--bad); }
  .stats { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
  .stat { display: flex; align-items: baseline; gap: 16px; font-size: 30px; }
  .stat .k { color: var(--ink-2); min-width: 190px; }
  .stat .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; }
  .stat .v.bad { color: var(--bad); }
  .stat .v .delta { color: var(--bad); font-size: 24px; margin-left: 8px; }
  .cmp { margin-top: 26px; border-top: 1px solid var(--panel-line); padding-top: 22px; display: flex; flex-direction: column; gap: 14px; }
  .cmp .t { font-size: 24px; color: var(--ink-2); margin-bottom: 2px; }
  .cmp .row { display: flex; align-items: baseline; gap: 16px; font-size: 28px; }
  .cmp .row .k { color: var(--ink-2); min-width: 150px; }
  .cmp .row .v { font-weight: 600; }
  .cmp .row .v.chg { color: var(--bad); }
  .cmp .row .v.add { color: var(--ok); font-size: 24px; }
  .foot { margin-top: auto; padding-top: 36px; font-size: 24px; color: var(--ink-2); }
  .foot b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <div class="kicker">358 次请求里，哪几次「出事」了？</div>
  <div class="title">点开一次<em>缓存回落</em>，<br>原因一目了然</div>

  <div class="banner">⚠ 缓存复用较上次请求回落 62 个百分点</div>

  <div class="card">
    <div class="head"><span class="n">#355</span><span class="pill">工具变化</span></div>
    <div class="stats">
      <div class="stat"><span class="k">缓存复用</span><span class="v bad">41%<span class="delta">↓62 pt</span></span></div>
      <div class="stat"><span class="k">新增输入</span><span class="v">17.6K tok</span></div>
      <div class="stat"><span class="k">估算上下文</span><span class="v">289.8K tok</span></div>
    </div>
    <div class="cmp">
      <div class="t">对比 #354</div>
      <div class="row"><span class="k">系统提示</span><span class="v chg">有变化 +17.6K</span></div>
      <div class="row"><span class="k">工具</span><span class="v chg">32 → 34</span><span class="v add">+ browser_open · + browser_click · ~ bash</span></div>
      <div class="row"><span class="k">工具顺序</span><span class="v">无变化</span></div>
      <div class="row"><span class="k">配置</span><span class="v">无变化</span></div>
    </div>
  </div>

  <div class="foot">只列<b>同时发生的变化</b>——相关，不构成因果 · dsh-context-lens</div>
</body>
</html>
